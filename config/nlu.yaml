nlu:
  confidence_threshold: 0.70   # below this → clarify
  ambiguity_gap: 0.15          # if top1_conf - top2_conf < this → clarify

  greeting_prefixes:
    - "你好"
    - "您好"
    - "早安"
    - "晚安"
    - "早上好"
    - "再见"
    - "拜拜"

  no_data_signals:
    - "no data"
    - "not found"
    - "no results"
    - "no records"
    - "未查询到"
    - "没有找到"
    - "0条结果"
    - "不在覆盖范围"
    - "不在数据库"
    - "未在知识库中检索到"
    - "未检索到"

  # 高置信、可解释的语义门。只有同时满足明确模式时才绕过 LLM；
  # 其余问题仍进入 few-shot + LLM + confidence gate。
  deterministic_hints:
    vague_phrases:
      - "有什么想法吗"
      - "这个靠谱吗"
      - "你觉得呢"
      - "这几个里面选哪个"
      - "帮我参考一下"
    underspecified_purchase_phrases:
      - "买什么车"
      - "什么车合适"
      - "选什么车"
      - "推荐什么车"
      - "怎么选车"
    purchase_scope_keywords:
      - "预算"
      - "通勤"
      - "家用"
      - "长途"
      - "城市"
      - "越野"
      - "SUV"
      - "轿车"
      - "纯电"
      - "插混"
      - "增程"
      - "品牌"
      - "车型"
      - "座"
    structured_keywords:
      - "销量"
      - "销售量"
      - "卖了"
      - "卖得"
      - "卖多少"
      - "排名"
      - "销量榜"
      - "价位"
      - "指导价"
      - "价格"
      - "前十"
      - "top"
    knowledge_keywords:
      - "口碑"
      - "车主评价"
      - "用户评价"
      - "怎么评价"
      - "评价怎样"
      - "体验评价"
      - "售后"
      - "评价如何"
      - "怎么看"
      - "好不好"
      - "为什么"
      - "报告"
      - "怎么分析"
      - "怎么解读"
      - "行业怎么看"
      - "特征"
      - "优势"
      - "战略"
      - "技术趋势"
      - "内饰"
      - "做工"
      - "能耗"
      - "新动作"
      - "动力电池回收"
      - "做了什么"
      - "政策"
      - "补贴"
      - "购置税"
    document_source_keywords:
      - "报告"
      - "研报"
      - "文档"
      - "文章"
      - "资料"
    database_request_keywords:
      - "卖得最好的"
      - "实际销量"
      - "查一下"
      - "列出"
      - "销量数据如何"
      - "冠军是谁"
      - "销量格局如何"
    sql_operation_keywords:
      - "环比"
      - "同比"
      - "每个月"
      - "各月"
      - "前十"
      - "前五"
      - "最快"
      - "最高"
      - "最低"
      - "最好"
      - "冠军"
      - "格局"
      - "新上榜"
      - "占比"
      - "份额"

    # 只有在句子里完全没有汽车业务信号时才会触发。它不是一个通用
    # 关键词黑名单，避免“天气如何影响新能源销量”被误判为闲聊。
    off_topic_chat_keywords:
      - "早饭"
      - "早餐"
      - "午饭"
      - "晚饭"
      - "天气"
      - "写代码"
      - "编程"
      - "电影"
      - "游戏"
      - "足球"
      - "股票"
      - "旅游"
      - "谢谢"
      - "感谢"
      - "笑话"
      - "写一首诗"
      - "你是谁"
      - "你能做什么"
    automotive_domain_keywords:
      - "车"
      - "汽车"
      - "新能源"
      - "品牌"
      - "车型"
      - "车企"
      - "电池"
      - "充电"
      - "续航"
      - "智驾"
      - "自动驾驶"

  few_shot_examples:
    - question: "比亚迪2025年各月销量是多少"
      intent: sql
    - question: "特斯拉Model Y今年卖了多少台"
      intent: sql
    - question: "2025年纯电Top10排名"
      intent: sql
    - question: "理想L9和小米SU7谁卖得多"
      intent: sql
    - question: "小米SU7口碑怎么样"
      intent: rag
    - question: "最近的新能源购车补贴政策有哪些"
      intent: rag
    - question: "比亚迪为什么能卖那么好"
      intent: rag
    - question: "问界M9的用户评价如何"
      intent: rag
    - question: "理想L9销量如何，为什么这么好卖"
      intent: hybrid
    - question: "2025年纯电销量Top5，分析各品牌优势"
      intent: hybrid
    - question: "你好"
      intent: chat
    - question: "谢谢"
      intent: chat
    - question: "销量排名"
      intent: clarify
    - question: "那辆车"
      intent: clarify
    - question: "最近的数据"
      intent: clarify
    - question: "奔驰2025年销量"
      intent: sql
    - question: "奔驰GLC 2025年销量"
      intent: sql
    - question: "截至今年全国充电桩有多少个"
      intent: rag
    - question: "充电基础设施同比增长了多少"
      intent: rag
    - question: "800V高压平台是怎样的技术趋势"
      intent: rag
    - question: "新能源汽车续航技术有哪些趋势"
      intent: rag
    - question: "充电桩里公共和私人各占多少"
      intent: rag
    - question: "一季度我国汽车整车出口情况如何"
      intent: rag
    - question: "纯电车续航现在到什么水平，销量靠前的有哪些"
      intent: hybrid
    - question: "哪些品牌销量领先，它们各自有什么特征"
      intent: hybrid

  slot_rules:
    sql_requires_one_of:
      - brands
      - models
      - time
      - energy_types
      - explicit_metric
    explicit_metric_keywords:
      - "top"
      - "Top"
      - "销量"
      - "对比"
      - "比较"
      - "最多"
      - "第一"
      - "销量榜"
      - "排名"
      - "价位"
      - "指导价"
      - "环比"
      - "同比"
      - "每个月"
      - "前十"
      - "前五"
      - "增长"
      - "下滑"
      - "最好"
      - "冠军"
      - "格局"

  # 关键词实体兜底列表（当 LLM 实体抽取返回空时使用）
  # 现在按字段始终与结构化模型输出合并；业务同学可直接维护，不需要改代码。
  entity_metric_keywords:
    - 销量
    - 销售量
    - 排名
    - 销量榜
    - 指导价
    - 价格
    - 口碑
    - 评分
    - 同比
    - 环比
    - 份额
    - 占比
  entity_energy_keywords:
    纯电: ["纯电", "BEV", "EV"]
    插混: ["插混", "插电混动", "PHEV"]
    增程: ["增程", "增程式", "EREV"]

  keyword_brands:
    - 比亚迪
    - 特斯拉
    - 理想
    - 蔚来
    - 小鹏
    - 零跑
    - 哪吒
    - 问界
    - 极氪
    - 小米
    - 吉利
    - 长安
    - 奇瑞
    - 长城
    - 五菱
    - 广汽
    - 埃安
    - 深蓝
    - 腾势
    - 奔驰
    - 宝马
    - 奥迪
    - 丰田
    - 本田
    - 大众
    - 福特
    - 日产
    - 上汽
    - 北汽
    - 东风
    - 红旗
    - 领克
    - 欧拉
    - 岚图
    - 智己
    - 阿维塔
    - 启源
    - 银河
    - 极越
    - 法拉利
    - 保时捷
    - 捷豹
    - 兰博基尼
    - 玛莎拉蒂
    - 沃尔沃
    - 路虎
    - 凯迪拉克
    - 别克
    - 雪佛兰
    - 现代
    - 起亚
    - 马自达
    - 斯巴鲁
    - 三菱

  business_rules:
    - if_contains: ["政策", "补贴", "购置税"]
      force_intent: rag
    - if_contains: ["法规", "标准", "规定", "条例"]
      force_intent: rag
    - if_contains: ["充电桩", "充电站", "充电基础设施", "换电站"]
      force_intent: rag
    - if_contains: ["充电", "充换电网络", "充电次数"]
      force_intent: rag
    - if_contains: ["出口", "进口", "渗透率", "保有量", "产量"]
      force_intent: rag
    - if_contains: ["800V", "固态电池", "智驾", "自动驾驶", "车路协同"]
      force_intent: rag
    - if_contains: ["续航", "续航里程"]
      force_intent: rag
